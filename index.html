<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Horseshoe Picks</title>
<meta name="description" content="Blue Horseshoe: NFL and college football parlay picks built from live lines.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8FA}
a{color:#1D5FD6}a:hover{color:#123F91}
button{font:inherit}
.fader{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;margin:0}
.fader:focus-visible{outline:2px solid #1D5FD6;outline-offset:3px;border-radius:4px}
.fader::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#D5DAE1}
.fader::-moz-range-track{height:4px;border-radius:2px;background:#D5DAE1}
.fader::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#1D5FD6;border:2px solid #FFFFFF;box-shadow:0 0 0 1px #1D5FD6}
.fader::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#1D5FD6;border:2px solid #FFFFFF;box-shadow:0 0 0 1px #1D5FD6}
.fader.off::-webkit-slider-thumb{background:#AEB5C0;box-shadow:0 0 0 1px #AEB5C0}
.fader.off::-moz-range-thumb{background:#AEB5C0;box-shadow:0 0 0 1px #AEB5C0}
.fader.onblue::-webkit-slider-runnable-track{background:rgba(255,255,255,0.35)}
.fader.onblue::-moz-range-track{background:rgba(255,255,255,0.35)}
.fader.onblue::-webkit-slider-thumb{background:#FFFFFF;border-color:#1D5FD6;box-shadow:0 0 0 1px #FFFFFF}
.fader.onblue::-moz-range-thumb{background:#FFFFFF;border-color:#1D5FD6;box-shadow:0 0 0 1px #FFFFFF}
.fader.onblue.off::-webkit-slider-thumb{background:#8FB0EC;box-shadow:0 0 0 1px #8FB0EC}
.fader.onblue.off::-moz-range-thumb{background:#8FB0EC;box-shadow:0 0 0 1px #8FB0EC}
.fader.onblue:focus-visible{outline-color:#FFFFFF}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Blue Horseshoe needs JavaScript to load live lines.</noscript>
<script type="text/x-template" id="tpl">
<div style="min-height: 100vh; background: #F7F8FA; color: #111827; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; box-sizing: border-box;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB;">
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px;">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px;">
        <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 8 v18 a16 16 0 0 0 32 0 v-18" stroke="#1D5FD6" stroke-width="11" fill="none" stroke-linecap="round"></path><circle cx="27" cy="42" r="3.2" fill="#FFFFFF"></circle><circle cx="37" cy="42" r="3.2" fill="#FFFFFF"></circle><circle cx="27.6" cy="42.6" r="1.5" fill="#111827"></circle><circle cx="37.6" cy="42.6" r="1.5" fill="#111827"></circle></svg>
        <span style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em;">Blue Horseshoe</span>
      </div>
      <nav aria-label="Pages" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6B7280;">NFL</span>
        <sc-for list="{{nflTabs}}" as="tb" hint-placeholder-count="4">
          <button type="button" onClick="{{tb.pick}}" aria-current="{{tb.current}}" style="{{tb.style}}">{{tb.label}}</button>
        </sc-for>
        <span aria-hidden="true" style="width: 1px; height: 18px; background: #E3E6EB;"></span>
        <button type="button" onClick="{{collegeTab.pick}}" aria-current="{{collegeTab.current}}" style="{{collegeTab.style}}">College</button>
      </nav>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-left: auto; padding: 6px 0;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B6472;">{{chipText}}</span>
        <span role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #6B7280;"><span aria-hidden="true" style="{{liveDot}}"></span>{{liveStamp}}</span>
      </span>
    </div>
  </header>

  <main style="max-width: 1400px; margin: 0 auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 16px;">

    <sc-if value="{{isBuilder}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 700;">The Horseshoe's ticket</h1>
          <span style="font-size: 13px; color: #5B6472;">Every leg passes 2 of 3 checks: price strength (S), home spot (H), market move (M).</span>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
          <aside aria-label="Ticket settings" style="flex: 1 1 260px; max-width: 100%; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Target odds</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
                <sc-for list="{{targets}}" as="t" hint-placeholder-count="6">
                  <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Legs</span>
                <span style="font-size: 12px; color: #5B6472;">{{legsHint}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <button type="button" onClick="{{legsAuto}}" aria-pressed="{{legsIsAuto}}" style="{{legsAutoStyle}}">Auto</button>
                <button type="button" onClick="{{legsDown}}" aria-label="Fewer legs" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #111827; font-size: 16px; cursor: pointer;">−</button>
                <span aria-live="polite" style="min-width: 40px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600;">{{faderLabel}}</span>
                <button type="button" onClick="{{legsUp}}" aria-label="More legs" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #111827; font-size: 16px; cursor: pointer;">+</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Markets</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
                <sc-for list="{{markets}}" as="m" hint-placeholder-count="3">
                  <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
                </sc-for>
              </div>
              <sc-if value="{{showPropFilter}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;">
                  <sc-for list="{{propTypes}}" as="p" hint-placeholder-count="6">
                    <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">{{p.label}}</button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Games</span>
                <button type="button" onClick="{{clearGames}}" style="background: none; border: none; padding: 4px 0; color: #1D5FD6; font-size: 12px; font-weight: 600; cursor: pointer;">All games</button>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px;">
                <sc-for list="{{games}}" as="g" hint-placeholder-count="10">
                  <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" title="{{g.title}}" style="{{g.style}}">{{g.short}}</button>
                </sc-for>
              </div>
              <span style="font-size: 12px; color: #6B7280;">{{gamesHint}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Stake</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
                <sc-for list="{{stakes}}" as="s" hint-placeholder-count="4">
                  <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.label}}</button>
                </sc-for>
              </div>
            </div>
          </aside>

          <section aria-label="Your ticket" style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: #E3E6EB; border: 1px solid #E3E6EB; border-radius: 8px; overflow: hidden;">
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">{{ticketTitle}}</span>
                <span style="{{priceStyle}}">{{priceStr}}</span>
              </div>
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">{{stakeLabel}} pays</span>
                <span style="{{payoutStyle}}">{{payoutStr}}</span>
              </div>
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">Profit</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; overflow-wrap: anywhere;">{{profitStr}}</span>
              </div>
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">Hit chance</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600;">{{hitStr}}</span>
              </div>
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">Legs · flags</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600;">{{legCount}} · {{flagStr}}</span>
              </div>
              <div style="background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; justify-content: center;">
                <span style="font-size: 11px; font-weight: 600; color: #5B6472;">Status</span>
                <span style="{{statusStyle}}">{{statusLabel}}</span>
              </div>
            </div>

            <sc-if value="{{showWarn}}" hint-placeholder-val="{{ false }}">
              <div role="status" style="display: flex; gap: 8px; align-items: flex-start; border: 1px solid #F0D9A8; background: #FFF8E8; color: #7A4A00; border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.45;">{{warnText}}</div>
            </sc-if>

            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
              <span style="font-size: 13px; color: #5B6472;">{{softLine}}</span>
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <button type="button" onClick="{{toggleAll}}" style="min-height: 34px; padding: 0 12px; background: #FFFFFF; color: #111827; border: 1px solid #D5DAE1; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;">{{toggleAllLabel}}</button>
                <button type="button" onClick="{{toggleBuild}}" aria-expanded="{{buildOpen}}" style="min-height: 34px; padding: 0 12px; background: #FFFFFF; color: #111827; border: 1px solid #D5DAE1; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;">{{buildLabel}}</button>
                <a href="https://www.hardrock.bet/" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; background: #1D5FD6; color: #FFFFFF; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none;">Open Hard Rock Bet
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3h7v7M13 3L4 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </a>
              </div>
            </div>

            <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 8px; overflow-x: auto;">
              <div>
                <sc-for list="{{ticket}}" as="leg" hint-placeholder-count="6">
                  <div style="border-bottom: 1px solid #EEF0F3;">
                    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;">
                      <span style="width: 18px; flex-shrink: 0; padding-top: 1px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B7280;">{{leg.num}}</span>
                      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
                        <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px;">
                          <span style="font-weight: 600;">{{leg.label}}</span>
                          <span style="font-size: 12px; color: #6B7280;">{{leg.game}} · {{leg.note}}</span>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px;">
                          <span style="{{leg.tagStyle}}">{{leg.tag}}</span>
                          <sc-if value="{{leg.belowBar}}" hint-placeholder-val="{{ false }}"><span title="Fails the 2-of-3 check. Shown because you picked this game." style="display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #FFF4E5; color: #9A5B00; white-space: nowrap;">Below the bar</span></sc-if>
                          <span style="display: flex; gap: 3px;" aria-label="{{leg.sigAria}}">
                            <sc-for list="{{leg.sigs}}" as="sg" hint-placeholder-count="3">
                              <span title="{{sg.name}}" style="{{sg.style}}">{{sg.letter}}</span>
                            </sc-for>
                          </span>
                          <span style="display: inline-flex; align-items: center; gap: 6px; color: #5B6472;">Conf <span style="font-family: 'IBM Plex Mono', monospace; color: #111827;">{{leg.conf}}</span><span style="width: 40px; height: 3px; background: #EEF0F3; border-radius: 2px; overflow: hidden; display: inline-block;"><span style="{{leg.barStyle}}; display: block;"></span></span></span>
                          <span style="{{leg.injStyle}}">{{leg.injLabel}}</span>
                        </div>
                      </div>
                      <span style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{leg.oddsStr}}</span>
                      <button type="button" onClick="{{leg.toggle}}" aria-expanded="{{leg.open}}" aria-label="Leg details" style="flex-shrink: 0; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 6px; cursor: pointer;">
                        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="{{leg.chevStyle}}"><path d="M2 4l4 4 4-4" stroke="#111827" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                      </button>
                    </div>
                    <sc-if value="{{leg.stackWarn}}" hint-placeholder-val="{{ false }}">
                      <div role="note" style="margin: 0 12px 8px 52px; font-size: 12px; color: #7A4A00;">{{leg.stackText}}</div>
                    </sc-if>
                    <sc-if value="{{leg.open}}" hint-placeholder-val="{{ false }}">
                      <div style="margin: 0 12px 12px 52px; padding: 12px; background: #F7F8FA; border-radius: 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; font-size: 13px;">
                        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; color: #5B6472;">Why the Horseshoe likes it</span><span>{{leg.note}}</span></div>
                        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; color: #5B6472;">Signals hit</span><span>{{leg.sigList}}</span></div>
                        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; color: #5B6472;">Injury report · {{leg.injStatus}}</span><span>{{leg.injWho}}</span><span style="font-size: 12px; color: #6B7280;">{{leg.injNote}}</span></div>
                      </div>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>

            <sc-if value="{{buildOpen}}" hint-placeholder-val="{{ false }}">
              <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px;">
                  <h2 style="margin: 0; font-size: 15px; font-weight: 700;">Build it on Hard Rock</h2>
                  <span style="font-size: 13px; color: #5B6472;">{{buildProgress}} · target <span style="font-family: 'IBM Plex Mono', monospace; color: #111827;">{{buildPrice}}</span> · <button type="button" onClick="{{resetChecks}}" style="background: none; border: none; padding: 0; color: #1D5FD6; font-size: 13px; font-weight: 600; cursor: pointer;">Reset</button></span>
                </div>
                <div style="height: 4px; background: #EEF0F3; border-radius: 2px; overflow: hidden;"><div style="{{buildBarStyle}}"></div></div>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px 16px;">
                  <sc-for list="{{buildGroups}}" as="grp" hint-placeholder-count="3">
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #5B6472;">{{grp.game}} · {{grp.count}}</span>
                      <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
                        <button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.done}}" style="{{it.rowStyle}}">
                          <span aria-hidden="true" style="{{it.boxStyle}}">{{it.mark}}</span>
                          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                            <span style="{{it.labelStyle}}">{{it.label}}</span>
                            <span style="font-size: 12px; color: #6B7280;">{{it.where}}</span>
                          </span>
                          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px;">{{it.oddsStr}}</span>
                        </button>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
                <span style="font-size: 12px; color: #6B7280;">Menu names in the app may differ slightly. If a line isn't offered, take the closest one and check the slip total.</span>
              </div>
            </sc-if>

            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Next best legs</span>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px;">
                <sc-for list="{{bench}}" as="b" hint-placeholder-count="3">
                  <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 6px; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px;">
                    <span style="display: flex; flex-direction: column; min-width: 0;"><span style="font-weight: 600;">{{b.label}}</span><span style="font-size: 12px; color: #6B7280;">{{b.game}} · conf {{b.conf}}</span></span>
                    <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{b.oddsStr}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isSpin}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 700;">Spin it</h1>
          <span style="font-size: 13px; color: #5B6472;">The Horseshoe draws a random parlay from legs that pass its checks and your Builder filters.</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
          <aside style="flex: 1 1 260px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Legs</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" onClick="{{rndDown}}" aria-label="Fewer legs" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #111827; font-size: 16px; cursor: pointer;">−</button>
                <span style="min-width: 40px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600;">{{rndN}}</span>
                <button type="button" onClick="{{rndUp}}" aria-label="More legs" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #111827; font-size: 16px; cursor: pointer;">+</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 12px; font-weight: 600; color: #5B6472;">Stake</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
                <sc-for list="{{stakes}}" as="s2" hint-placeholder-count="4">
                  <button type="button" onClick="{{s2.pick}}" aria-pressed="{{s2.on}}" style="{{s2.style}}">{{s2.label}}</button>
                </sc-for>
              </div>
            </div>
            <button type="button" onClick="{{spin}}" style="min-height: 40px; background: #1D5FD6; color: #FFFFFF; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;">Spin</button>
            <span style="font-size: 12px; color: #6B7280;">{{spinNote}}</span>
          </aside>
          <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 'builder', target: 'fav', market: 'both', games: [], stake: 5, props: [], open: {}, allOpen: false, build: false, checked: {}, legs: 'auto', lastLegs: 6, rnd: 4, seed: 7, evOnly: false, fadeOnly: false, fadeMkt: 'all', cfTab: 'picks', cfTarget: 'safe', cfMkts: [], cfLegs: 'auto', cfLastLegs: 4, cfFadeMkt: 'all', cfFadeOnly: false };
  }

  data() { return window.BH.nfl; }

  cfData() { return window.BH.cf; }

  dec(o) { return o > 0 ? 1 + o / 100 : 1 + 100 / (-o); }
  amer(d) {
    if (d <= 1) return '—';
    var v = d >= 2 ? (d - 1) * 100 : -100 / (d - 1);
    var r = Math.round(v);
    var s = Math.abs(r).toLocaleString('en-US');
    return r > 0 ? '+' + s : '-' + s;
  }
  money(v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  fitSize(str, max, min) {
    var len = String(str).length;
    return Math.max(min, Math.min(max, Math.floor(max * 8 / Math.max(len, 8))));
  }
  fmtOdds(o) { return o > 0 ? '+' + o : String(o); }

  renderVals() {
    var self = this;
    var st = this.state;
    var D = this.data();
    var B = '#1D5FD6', TXT = '#111827', MUTED = '#5B6472', FAINT = '#6B7280', BORDER = '#D5DAE1', LIGHT = '#EEF0F3';
    var GREEN = '#0F7A43', AMBER = '#9A5B00', RED = '#B42318';
    var gameMap = {};
    D.games.forEach(function (g) { gameMap[g.id] = g; });
    var allIds = D.games.map(function (g) { return g.id; });
    var activeGames = st.games.length ? st.games : allIds;

    // ---- shared control styles
    var seg = function (on) {
      return 'min-height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; box-sizing: border-box; ' + (on ? 'background: ' + B + '; color: #FFFFFF; border: 1px solid ' + B + ';' : 'background: #FFFFFF; color: ' + TXT + '; border: 1px solid ' + BORDER + ';');
    };
    var chip = function (on) {
      return 'min-height: 28px; padding: 0 10px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500; box-sizing: border-box; ' + (on ? 'background: #EEF4FE; color: ' + B + '; border: 1px solid #A9C4F5;' : 'background: #FFFFFF; color: ' + MUTED + '; border: 1px solid ' + BORDER + ';');
    };
    var tag = function (txt, kind) {
      var c = kind === 'line' || kind === 'spread' ? ['#EEF4FE', B] : kind === 'total' ? ['#F3EEFE', '#5B3FB8'] : kind === 'ml' ? ['#EAF6EF', GREEN] : ['#F1F3F6', '#374151'];
      return 'display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: ' + c[0] + '; color: ' + c[1] + '; white-space: nowrap;';
    };

    // With no games picked, only Horseshoe picks (2 of 3 checks) qualify.
    // Once someone picks games, every leg in those games is fair game, still ranked by confidence.
    var meetsBar = function (l) { return l.s[0] + l.s[1] + l.s[2] >= 2; };
    var passes = function (l) {
      if (st.market !== 'both' && l.k !== st.market) return false;
      if (l.k === 'prop' && st.props.length && st.props.indexOf(l.c) === -1) return false;
      return true;
    };
    var qualCount = {};
    var allCount = {};
    D.legs.forEach(function (l) { if (passes(l) && meetsBar(l)) qualCount[l.g] = (qualCount[l.g] || 0) + 1; if (passes(l)) allCount[l.g] = (allCount[l.g] || 0) + 1; });
    // Horseshoe picks first, then every other leg, each group by confidence.
    // Below-the-bar legs only get used when someone picks games, sets a leg count, or chases a price the picks can't reach.
    var byConf = function (a, b) { return b.conf - a.conf; };
    var inPlay = D.legs.filter(function (l) { return passes(l) && activeGames.indexOf(l.g) !== -1; });
    // One side per game for moneyline/spread (books won't take both), one side of each total, one side of each prop line.
    var conflictKey = function (l) {
      if (l.mk === 'ml' || l.mk === 'spread') return l.g + '|side';
      if (l.mk === 'total') return l.g + '|total';
      if (l.k === 'prop') return l.pk || (l.g + '|' + l.label.replace(/ (over|under) /, ' ~ '));
      return l.g + '|' + l.label;
    };
    var dedupe = function (arr) { var seen = {}; return arr.filter(function (l) { var k = conflictKey(l); if (seen[k]) return false; seen[k] = 1; return true; }); };
    var pool = dedupe(inPlay.filter(meetsBar).sort(byConf).concat(inPlay.filter(function (l) { return !meetsBar(l); }).sort(byConf)));
    var picksPool = pool.filter(meetsBar);
    if (!st.games.length && st.legs === 'auto' && st.target === 'fav') pool = picksPool;

    // ---- NFL ticket selection
    var ticket = [];
    var decTotal = 1;
    var reached = true;
    var targetDec = 0;
    var N = st.legs === 'auto' ? 0 : st.legs;
    var prodDec = function (arr) { var d = 1; arr.forEach(function (l) { d *= self.dec(l.odds); }); return d; };
    if (st.target === 'fav') {
      if (N) ticket = pool.slice(0, N);
      else {
        ticket = picksPool.filter(function (l) { return l.conf >= 75; }).slice(0, 6);
        if (ticket.length < 3) ticket = pool.slice(0, 3);
      }
      decTotal = prodDec(ticket);
    } else if (N) {
      targetDec = this.dec(st.target);
      ticket = pool.slice(0, N);
      var benchPool = pool.slice(N);
      for (var guard = 0; guard < 40; guard++) {
        if (prodDec(ticket) >= targetDec || !ticket.length) break;
        var minIx = 0;
        ticket.forEach(function (l, ix) { if (self.dec(l.odds) < self.dec(ticket[minIx].odds)) minIx = ix; });
        var minDec = self.dec(ticket[minIx].odds);
        var swapIx = -1;
        for (var b = 0; b < benchPool.length; b++) { if (self.dec(benchPool[b].odds) > minDec) { swapIx = b; break; } }
        if (swapIx === -1) break;
        var out = ticket[minIx];
        ticket[minIx] = benchPool[swapIx];
        benchPool.splice(swapIx, 1);
        benchPool.push(out);
      }
      ticket.sort(function (a, b2) { return b2.conf - a.conf; });
      decTotal = prodDec(ticket);
      reached = decTotal >= targetDec;

      cfTabs: cfTabs, cfIsPicks: st.cfTab === 'picks', cfIsDogs: st.cfTab === 'dogs', cfIsFade: st.cfTab === 'fade',
      cfTargets: cfTargets, cfMktPills: cfMktPills,
      cfSizeIsAuto: cfIsAuto,
      cfSizeAuto: function () { self.setState({ cfLegs: cfIsAuto ? (st.cfLastLegs || 4) : 'auto', cfLastLegs: cfIsAuto ? st.cfLastLegs : st.cfLegs }); },
      cfSizeAutoStyle: chipW(cfIsAuto), cfStakes: cfStakes, cfPillars: cfPillars,
      cfShowOU: mkOk('total'),
      cfOUOpts: [{ v: 'either', label: 'Either' }, { v: 'over', label: 'Overs only' }, { v: 'under', label: 'Unders only' }].map(function (o) {
        var on = cfOU === o.v;
        var n = candList.filter(function (c) { return c.k === 'total' && (o.v === 'either' || c.label.toLowerCase().indexOf(o.v) === 0); }).length;
        return { label: o.label + ' · ' + n, on: on, style: chipW(on), pick: function () { self.setState({ cfOU: o.v }); } };
      }),
      cfFaderVal: cfIsAuto ? (st.cfLastLegs || 4) : cfN, cfFaderClass: cfIsAuto ? 'fader onblue off' : 'fader onblue', cfFaderLabel: cfIsAuto ? 'Auto' : String(cfN),
      cfDown: function () { var v = Math.max(2, (cfIsAuto ? (st.cfLastLegs || 4) : cfN) - 1); self.setState({ cfLegs: v, cfLastLegs: v }); },
      cfUp: function () { var v = Math.min(10, (cfIsAuto ? (st.cfLastLegs || 4) : cfN) + 1); self.setState({ cfLegs: v, cfLastLegs: v }); },
      cfOnFader: function (e) { var v = parseInt(e.target.value, 10); if (!isNaN(v)) self.setState({ cfLegs: v, cfLastLegs: v }); },
      cfSizeHint: cfIsAuto ? 'Horseshoe decides' : cfN + ' legs, one per game',
      cfTicket: cfRows, cfBench: cfBench, cfLegCount: cfTicket.length,
      cfTicketTitle: st.cfTarget === 'safe' ? 'Safest price' : 'Path to ' + (st.cfTarget > 0 ? '+' + st.cfTarget : st.cfTarget),
      cfPrice: cfPriceVal, cfPriceStyle: mono(this.fitSize(cfPriceVal, 22, 15), '#FFFFFF'),
      cfPayout: cfPayVal, cfPayoutStyle: mono(this.fitSize(cfPayVal, 17, 13), '#FFFFFF'),
      cfHitStr: cfTicket.length ? (cfHit * 100).toFixed(1) + '%' : '—',
      cfBookStr: cfTicket.length ? (cfBook * 100).toFixed(1) + '%' : '—',
      cfWarn: !cfTicket.length || cfShort || !cfReached,
      cfWarnText: !cfTicket.length ? 'No lines pass the Horseshoe’s checks with these filters. Turn on more lines.' : cfShort ? 'Only ' + cfTicket.length + ' games have a line the Horseshoe trusts, fewer than ' + cfN + '. Turn on more lines.' : (cfN && !cfReached) ? 'With ' + cfN + ' legs the Horseshoe tops out at ' + this.amer(cfDec) + '. Make it bigger or lower the target.' : 'Even the Horseshoe can’t reach this price with one line per game. Turn on more lines or lower the target.',
      cfDogs: cfDogs, cfUpsetLegs: upRows, cfHasUpset: upT.length > 0,
      cfUpsetPrice: upPriceVal, cfUpsetHit: upT.length ? (upHit * 100).toFixed(1) + '%' : '—',
      cfUpsetBook: upT.length ? (upBook * 100).toFixed(1) + '%' : '—',
      cfUpsetPay: upPayVal,
      upPriceStyle: mono(this.fitSize(upPriceVal, 22, 15), '#FFC24D'),
      upPayStyle: mono(this.fitSize(upPayVal, 17, 13), '#FFFFFF'),
      upPillars: upPillars, upModes: upModes, upNStr: String(upN),
      upDown: function () { self.setState({ upN: Math.max(2, upN - 1) }); },
      upUp: function () { self.setState({ upN: Math.min(5, upN + 1) }); },
      upTeaser: upRows.map(function (r) { return r.label; }).join(' + '),
      cfGoDogs: function () { self.setState({ cfTab: 'dogs' }); try { window.scrollTo(0, 0); } catch (e) {} },
      cfFadeCards: cfFade.shown, cfFadeMkts: cfFadeMkts, cfFadeOnly: st.cfFadeOnly,
      cfFadeToggle: function () { self.setState({ cfFadeOnly: !st.cfFadeOnly }); }, cfFadeBtnStyle: chip(st.cfFadeOnly)
    };
  }
}

(function () {
  var app = BHRuntime.mount(Component, document.getElementById('tpl').textContent, document.getElementById('app'));
  function refresh() { return BHLines.load().then(function () { app.forceUpdate(); }); }
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, BHLines.REFRESH_MS);
  setInterval(function () { app.forceUpdate(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  // Pick up site updates automatically: if a newer version is published, reload once.
  setInterval(function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      if (!v || !v.v || v.v === window.BH_VERSION) return;
      var tried = null; try { tried = sessionStorage.getItem('bhReloadFor'); } catch (e) {}
      if (tried === v.v) return; // already tried once for this version; don't loop
      try { sessionStorage.setItem('bhReloadFor', v.v); } catch (e) {}
      location.replace(location.pathname + '?v=' + v.v + location.hash);
    }).catch(function () {});
  }, 60000);
})();
