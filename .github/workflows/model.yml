name: Horseshoe Model

# Pulls college power ratings from CollegeFootballData.com and writes data/model.json.
# Once a day, plus a second pass Friday and Saturday mornings. About 6 CFBD calls a run.
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "41 14 * * 5,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horseshoe-model
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projections
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/model.mjs
      - name: Save
        run: |
          git config user.name "blue-horseshoe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Horseshoe Model"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 7; done
          exit 1
