name: Refresh lines

# Every 15 minutes: save a backup copy of ESPN's lines (used only if a visitor's browser can't reach ESPN).
# Every 4 hours: pull book-by-book NFL prices from The Odds API for Line check (stays inside the free 500-credit plan).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_props:
        description: 'Pull props now even if the last pull is recent'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-lines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_FORCE: ${{ inputs.force_props && '1' || '' }}
        run: node scripts/refresh.mjs
      - name: Save changes
        run: |
          git config user.name "blue-horseshoe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh lines"
            git push
          fi
