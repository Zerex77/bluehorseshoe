name: Refresh lines

# GitHub only runs scheduled workflows every few hours when it's busy, so instead of relying on the
# schedule, one run stays up for ~5.5 hours refreshing every 10 minutes, then starts the next run.
# The hourly schedule is only a backup in case the chain ever breaks.
# Each pass: ESPN backup lines, book prices / props (on their own slower timers), and grading picks.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_props:
        description: 'Pull props now even if the last pull is recent'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-lines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh every 10 minutes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          FORCE_FIRST: ${{ inputs.force_props && '1' || '' }}
        run: |
          git config user.name "blue-horseshoe-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          first=1
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || git rebase --abort || true
            if [ "$first" = 1 ] && [ -n "$FORCE_FIRST" ]; then export SGO_FORCE=1; else unset SGO_FORCE; fi
            first=0
            node scripts/refresh.mjs || echo "refresh failed, trying again next pass"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Refresh lines"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
            fi
            sleep 600
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref main -R ${{ github.repository }}
